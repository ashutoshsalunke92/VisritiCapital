# Short Strangle Hedged — WEEKLY POSITIONAL Exit Policy
# Capital-based SL/TP per the PDF Section 1 matrix: SL=2%, TP=4% of ₹2.5L allocation.

trade_level:
  enabled: true
  threshold:
    trigger_source: LIVE_PNL
    exit_type: PERCENTAGE
    basis_source: CAPITAL_ALLOCATED
    sl_value: 0.02                     # -2% of capital = -₹5,000
    tp_value: 0.04                     # +4% of capital = +₹10,000
    trailing_enabled: false
    trail_activate_value: 0.02
    trail_giveback_pct: 0.30

leg_level:
  enabled: false
